<div class="task-card" [class.task-done]="isDone()">
  <div class="task-header">
    <h3 class="task-title">{{ task.title }}</h3>
    <span class="priority-badge" [ngClass]="getPriorityClass()">
      {{ task.priority }}
    </span>
  </div>

  <p class="task-description">{{ task.desc }}</p>

  <div class="task-meta">
    <div class="meta-item">
      <i class="bi bi-tag-fill"></i>
      <span>{{ task.category }}</span>
    </div>
    <div class="meta-item">
      <i class="bi bi-calendar-fill"></i>
      <span>{{ task.date }}</span>
    </div>
  </div>

  <div class="task-status">
    <span class="status-badge" [class.status-done]="isDone()">
      <i [class.bi-check-circle-fill]="isDone()" [class.bi-circle]="!isDone()"></i>
      {{ isDone() ? 'Completed' : 'Pending' }}
    </span>
  </div>

  <div class="task-actions">
    <button
      class="btn btn-toggle"
      (click)="onToggle()"
      [title]="isDone() ? 'Mark as Not Done' : 'Mark as Done'"
    >
      <i [class.bi-check-circle]="!isDone()" [class.bi-x-circle]="isDone()"></i>
      {{ isDone() ? 'Undo' : 'Complete' }}
    </button>
    
    <button
      class="btn btn-delete"
      (click)="onDelete()"
      title="Delete Task"
    >
      <i class="bi bi-trash-fill"></i>
      Delete
    </button>
  </div>
</div>
