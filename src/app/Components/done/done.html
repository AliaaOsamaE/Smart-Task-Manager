<div class="tasks-container">
  <h2 class="tasks-title">
    <i class="bi bi-check-circle-fill"></i>
    Completed Tasks
  </h2>
  <div class="tasks-grid" *ngIf="tasks.length > 0">
    <app-task-card
      *ngFor="let task of tasks"
      [task]="task"
      (delete)="onDeleteTask($event)"
      (toggle)="onToggleTask($event)"
    ></app-task-card>
  </div>
</div>
