<header class="header">
  <div class="header-container">
    <!-- Logo/Brand -->
    <div class="brand">
      <i class="bi bi-check2-square"></i>
      <h1>Smart Task Manager</h1>
    </div>

    <nav class="nav">
      <ul class="nav-list">
        <li class="nav-item">
          <a routerLink="/layout/home" class="nav-link">
            <i class="bi bi-house-fill"></i>
            Home
          </a>
        </li>

        <ng-container *ngIf="isLoggedIn()">
          <li class="nav-item">
            <a routerLink="/layout/add-task" class="nav-link">
              <i class="bi bi-plus-circle-fill"></i>
              Add Task
            </a>
          </li>
          <li class="nav-item">
            <a routerLink="/layout/all-tasks" class="nav-link">
              <i class="bi bi-list-check"></i>
              My Tasks
            </a>
          </li>
        </ng-container>

        <ng-container *ngIf="!isLoggedIn()">
          <li class="nav-item">
            <a routerLink="/login" class="nav-link">
              <i class="bi bi-box-arrow-in-right"></i>
              Login
            </a>
          </li>
          <li class="nav-item">
            <a routerLink="/signup" class="nav-link">
              <i class="bi bi-person-plus-fill"></i>
              Sign Up
            </a>
          </li>
        </ng-container>
      </ul>
    </nav>
    
    <div class="user-section" *ngIf="isLoggedIn()">
      <span class="username">
        <i class="bi bi-person-circle"></i>
        {{ getUsername() }}
      </span>
      <button class="btn-logout" (click)="onLogout()">
        <i class="bi bi-box-arrow-right"></i>
        Logout
      </button>
    </div>
  </div>
</header>
