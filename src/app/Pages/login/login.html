<div class="login-container">
  <div class="login-card">
    <div class="login-header">
      <h2>Login to Your Account</h2>
      <p>Welcome back! Please enter your credentials</p>
    </div>

    <!-- Error Alert -->
    <div class="alert alert-danger" *ngIf="showError">
      <i class="bi bi-exclamation-triangle-fill"></i>
      {{ errorMessage }}
    </div>

    <!-- Login Form -->
    <form (ngSubmit)="onLogin()" #loginForm="ngForm">
      <!-- Email Field -->
      <div class="form-group">
        <label for="email">
          <i class="bi bi-envelope-fill"></i>
          Email Address
        </label>
        <input
          type="email"
          id="email"
          name="email"
          class="form-control"
          [(ngModel)]="email"
          placeholder="Enter your email"
          required
          email
          #emailField="ngModel"
        />
        <div class="error-message" *ngIf="emailField.invalid && emailField.touched">
          <small *ngIf="emailField.errors?.['required']">Email is required</small>
          <small *ngIf="emailField.errors?.['email']">Please enter a valid email</small>
        </div>
      </div>

      <!-- Password Field -->
      <div class="form-group">
        <label for="password">
          <i class="bi bi-lock-fill"></i>
          Password
        </label>
        <input
          type="password"
          id="password"
          name="password"
          class="form-control"
          [(ngModel)]="password"
          placeholder="Enter your password"
          required
          minlength="6"
          #passwordField="ngModel"
        />
        <div class="error-message" *ngIf="passwordField.invalid && passwordField.touched">
          <small *ngIf="passwordField.errors?.['required']">Password is required</small>
          <small *ngIf="passwordField.errors?.['minlength']">Password must be at least 6 characters</small>
        </div>
      </div>

      <!-- Submit Button -->
      <button 
        type="submit" 
        class="btn btn-primary btn-block"
        [disabled]="loginForm.invalid"
      >
        <i class="bi bi-box-arrow-in-right"></i>
        Login
      </button>
    </form>

    <!-- Sign Up Link -->
    <div class="signup-link">
      <p>Don't have an account? <a routerLink="/signup">Sign Up</a></p>
    </div>

    <!-- Back to Home -->
    <div class="back-link">
      <a routerLink="/layout/home">
        <i class="bi bi-arrow-left"></i>
        Back to Home
      </a>
    </div>
  </div>
</div>
